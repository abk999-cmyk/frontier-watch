topToBottomCurve:
  bestGuess: degrey-2004-escape-velocity-figure
  note: >-
    The "line that goes opposite-exponential from top to bottom" best matches Figure 1 of de Grey's 2004 PLoS Biology
    paper that introduced the phrase "escape velocity". It plots remaining life expectancy against time. People who are
    80 or 100 when first-generation rejuvenation therapies arrive follow curves that start flat at the top and plunge
    ever faster to zero, like a body walking off a cliff. Younger people (50, 30, 0) dip and then curve back up, and that
    upturn is LEV. The figure is conceptual, with no data behind it. The same shape (flat top, accelerating fall) is also
    the classic survival curve, which is the best data-backed chart; its data is in dataFile. Candidate 5 is the
    well-known Wikipedia LEV image. It is a rising exponential (bottom to top), listed in case the memory is mirrored.
  dataFile: data/curated/survival-curves.csv
  dataUrl: https://catalog.ourworldindata.org/garden/hmd/2025-10-22/hmd/life_tables.parquet
  candidates:
    - id: degrey-2004-escape-velocity-figure
      name: "\"Physical and Actuarial Escape Velocities\" (de Grey 2004, PLoS Biology, Fig. 1)"
      shape: >-
        y = remaining life expectancy, x = time. Curves for ages 100 and 80 fall from top to bottom ever faster; curves
        for 50, 30 and 0 bottom out and then rise (escape velocity).
      whyItFits: It is the original LEV chart, and its falling curves are exactly "top to bottom, opposite-exponential".
      source: 'de Grey ADNJ (2004), "Escape velocity: why the prospect of extreme human life extension matters now", PLoS Biol 2(6):e187. CC BY 4.0.'
      url: https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.0020187
      figureImage: https://journals.plos.org/plosbiology/article/figure/image?size=large&id=10.1371/journal.pbio.0020187.g002
      data: >-
        No data behind it. A real-data version: follow one cohort along the diagonal of period life tables, plotting
        remaining life expectancy e(age0 + k, year0 + k) against year0 + k. A flat or rising segment would be LEV.
        See derived.cohortRemainingLE.
    - id: survival-curves
      name: Survival curves by era (share of a birth cohort alive at each age), "rectangularization"
      shape: >-
        Starts at 100% at age 0 and stays high, then falls steeply after ~70. Gompertz mortality makes the late drop look
        like an exponential flipped top to bottom. Across eras the curve becomes more rectangular.
      whyItFits: It has the same top-to-bottom accelerating fall and is often shown in LEV and longevity talks. It is fully data-backed.
      source: Human Mortality Database period life tables (l(x), radix 100,000), England and Wales, via Our World in Data's catalog.
      url: https://ourworldindata.org/life-expectancy
      data: >-
        dataFile (England and Wales 1851, 1900, 1950, 2000, 2022; ages 0, 1, 5, 10 ... 110; survivingPct = l(x)/1000).
        The quantile form covers 46 countries, 1751-2024:
        https://ourworldindata.org/grapher/survival-ages-across-the-population.csv (plot x = age value, y = percentile).
    - id: remaining-le-vs-age
      name: Remaining life expectancy vs age
      shape: Declines from e0 (~81-85) toward ~2 years at 100. LEV would appear as this curve lifting year after year by at least as much as people age.
      whyItFits: It is a top-to-bottom curve and is the quantity LEV is defined on, but its shape is convex rather than a cliff.
      source: OWID / HMD
      url: https://ourworldindata.org/grapher/remaining-life-expectancy-at-different-ages
      data: https://ourworldindata.org/grapher/remaining-life-expectancy-at-different-ages.csv (ages 0/10/15/25/45/65/80); all ages 0-110 are in dataUrl (life_expectancy column).
    - id: gompertz-inverted
      name: Gompertz mortality-rate curve shown inverted
      shape: Death probability rises roughly exponentially with age (doubling every ~8 years). Flipped, it becomes a top-to-bottom exponential.
      whyItFits: It is literally an "opposite exponential", but it is rarely drawn inverted.
      source: HMD q(x) in dataUrl (probability_of_death, in %). The WHO GHO 5-year age groups are also available.
      url: https://ourworldindata.org/grapher/probability-of-dying-by-age
      data: https://ourworldindata.org/grapher/probability-of-dying-by-age.csv (192 entities, 2000-2021, groups <1 to 80-84)
    - id: wikipedia-lev-image
      name: Wikipedia "Longevity Escape Velocity" image (User:Zedatik, 2012, public domain)
      shape: >-
        A rising exponential, with "life expectancy gained via advancing technologies" against "advancing technologies",
        crossing a dashed "Longevity escape velocity" line. It goes bottom to top, not top to bottom.
      whyItFits: It is the most-viewed LEV image, so it is worth ruling in or out with the user.
      url: https://commons.wikimedia.org/wiki/File:Longevity_Escape_Velocity.png
  derived:
    cohortRemainingLE:
      method: >-
        Japan, both sexes, HMD period life tables from dataUrl. For a person aged A in 1973, the table gives remaining
        life expectancy e(A+k) in year 1973+k, for k = 0, 5, 10, ... "noProgress" reads the same ages off the fixed 1973
        table, i.e. what would happen with no medical progress since 1973. Actual minus noProgress is the progress
        already banked. LEV requires the actual curve to stop falling.
      source: https://catalog.ourworldindata.org/garden/hmd/2025-10-22/hmd/life_tables.parquet
      years: [1973, 1978, 1983, 1988, 1993, 1998, 2003, 2008, 2013, 2018, 2023]
      cohorts:
        - { ageIn1973: 30, actual: [45.43, 42.39, 38.8, 35.29, 31.45, 28.16, 24.86, 21.21, 17.61, 14.29, 10.67], noProgress: [45.43, 40.69, 36.02, 31.45, 27.0, 22.68, 18.57, 14.76, 11.36, 8.43, 6.1] }
        - { ageIn1973: 50, actual: [27.0, 24.18, 21.05, 17.98, 14.88, 12.39, 9.91, 7.37, 5.14, 3.57, 2.37], noProgress: [27.0, 22.68, 18.57, 14.76, 11.36, 8.43, 6.1, 4.37, 3.09, 2.26, 1.73] }
        - { ageIn1973: 80, actual: [6.1, 4.8, 3.6, 2.69, 2.07, 1.73], noProgress: [6.1, 4.37, 3.09, 2.26, 1.73, 1.41] }
    levGauge:
      method: OLS slope of period remaining life expectancy at 65 (e65) over the last 21 HMD years. LEV at 65 would need a slope of 1.0 or more years per year.
      source: https://catalog.ourworldindata.org/garden/hmd/2025-10-22/hmd/life_tables.parquet
      e65SlopeYearsPerYear:
        - { country: Japan, window: [2003, 2023], slope: 0.086, e65Latest: 22.08 }
        - { country: England and Wales, window: [2002, 2022], slope: 0.102, e65Latest: 19.96 }
        - { country: United States, window: [2003, 2023], slope: 0.044, e65Latest: 19.64 }
      note: >-
        HMD and OWID's combined HMD+UN WPP series can differ slightly (Japan e65 2023: HMD 22.08, OWID CSV 22.49).
        Pick one source per chart.

