# Longevity Escape Velocity (LEV): forecasts, milestones, the "top-to-bottom" LEV chart, and life-expectancy data.
# Researched 2026-09-24. Rules: see README.md (every fact has a url, ISO dates, never invent a number).
#
# Format
#   lastChecked            date of the last verification pass
#   definition             { text, url }
#   forecasts
#     metaculus            one date question: { id, url, title, question, scale, api, communityMedian, history[], note }
#       communityMedian    { asOf, forecasters, q1, median, q3 }   recency-weighted Community Prediction (the site default)
#       history[]          { date, forecasters, q1, median, q3, q3AtUpperBound? }   sampled ~6-monthly from the full series;
#                          date = start of that aggregation window. q3AtUpperBound: true means the upper quartile sits
#                          at/above the 2200-01-01 range max (open upper bound).
#     manifold[]           { id, question, url, probability (0-100), bettors, asOf, closes, resolved, resolution?, note? }
#     named[]              { id, who, statedOn, datePrecision?, claim, levYear? | levYearRange? [lo, hi], probability? (0-100), url, sources? }
#   annotations[]          { id, date, datePrecision?, category, title, summary, url, sources? }
#                          category: protein-structure | ai-biology | ai-drug | rejuvenation-study | itp | aging-biomarker
#   topToBottomCurve       { bestGuess, candidates[], dataFile, dataUrl, derived, note }
#     candidates[]         { id, name, shape, whyItFits, source, url, data? }
#     derived              numbers computed by us from a named source file; each block states the method.
#   lifeExpectancyData     verified OWID grapher CSVs (+ one HMD parquet): { id, url, columns, shortColumns?, coverage, latest?, note }
#   recordTrend            slope of the record-life-expectancy line, computed from the OWID CSV
#
# Probabilities are 0-100. Dates are ISO; month-only dates use the 1st with datePrecision: month.

lastChecked: 2026-09-24

definition:
  text: >-
    LEV is reached when remaining life expectancy (not life expectancy at birth) rises by at least one year per
    calendar year, so that medical progress outpaces ageing.
  url: https://en.wikipedia.org/wiki/Longevity_escape_velocity

