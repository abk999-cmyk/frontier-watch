  - id: itp-2026-null-results
    date: 2026-03-17
    category: itp
    title: "NIA ITP: eight compounds fail to extend lifespan"
    summary: >-
      Astaxanthin, meclizine, mitoglitazone, pioglitazone, alpha-ketoglutarate, mifepristone, methotrexate and
      atorvastatin-telmisartan did not extend lifespan in UM-HET3 mice. Earlier hits failed at new doses or later starts.
