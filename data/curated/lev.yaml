recordTrend:
  source: https://ourworldindata.org/grapher/maximum-life-expectancy-sex-female.csv
  method: OLS of the yearly record female period e0 on year.
  slopes:
    - { window: [1840, 2023], yearsPerYear: 0.251 }
    - { window: [1900, 2023], yearsPerYear: 0.266 }
    - { window: [1950, 2023], yearsPerYear: 0.204 }
    - { window: [1990, 2023], yearsPerYear: 0.186 }
  note: >-
    This is the Oeppen-Vaupel "broken limits" line: about 3 months of record life expectancy gained per calendar year
    for 180 years, slowing since 1950. LEV needs at least 1.0 year per year in REMAINING life expectancy, roughly 4x the
    historic record pace at birth and 10-20x the recent pace at age 65 (0.04-0.10 years/year; see topToBottomCurve.derived.levGauge).
  sources: [https://doi.org/10.1126/science.1069675]   # Oeppen & Vaupel, "Broken Limits to Life Expectancy", Science, 2002-05-10
