    category: rejuvenation-study
    title: "LEVF: RMR2 pilot underway; main phase ~mid-2026, significant results 2028"
    summary: >-
      RMR2 is planned with 8 interventions, rapamycin and running wheels as baseline for all groups, repeated dosing,
      20 groups and 2,000 mice. On 2026-03-10 LEVF said launching the full study needs ~$5M and that funding is the
