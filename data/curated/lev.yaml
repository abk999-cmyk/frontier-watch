  - id: transcriptomic-mortality-clocks
    date: 2026-05-27
    category: aging-biomarker
    title: Universal transcriptomic hallmarks of mammalian ageing and mortality (Nature)
    summary: >-
      Over 11,000 transcriptomes from 4 mammals were used to train biomarkers of age and expected mortality. They
      predict lifespan-modulating interventions and time to death.
    url: https://www.nature.com/articles/s41586-026-10542-3
  - id: rentosertib-aging-clocks
