# Benchmark registry. The groups appear in Abhinav's order: hle → swe → agentic → science → math → bio → index.
#
# unit:       pct (0–100) | minutes | usd | points | index
# ceiling:    upper bound for bounded benchmarks (100 for pct). null = unbounded (drives the projection model choice)
# saturatedOn: date the benchmark effectively maxed out (frontier ≥ ~95% or at noise ceiling); null if not
# epoch:      optional auto-fetch mapping from the Epoch benchmark zip
#   file:  CSV name inside the zip
#   score: score column
#   scale: multiplier to reach `unit` (e.g. 100 for 0–1 fractions)
#   where: optional {column: substring} row filter
#   extra: optional columns carried through as metadata (tokens, cost, effort, harness…)

# ── HLE ──────────────────────────────────────────────────
- id: hle
  name: Humanity's Last Exam
  short: HLE
  group: hle
  unit: pct
  ceiling: 100
  released: 2025-01-23
  url: https://lastexam.ai
  description: 2,500 expert-written closed-ended questions across 100+ subjects. The table splits it into independent runs and lab-reported runs with and without tools.
  epoch: { file: hle_external.csv, score: Accuracy, scale: 100, provenance: independent, tools: false }

