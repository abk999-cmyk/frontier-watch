# Measurable proxies for "how far is reality behind (or ahead of) AI 2027?", as of 2026-09-24.
#
# Method: matched value. For each proxy, pick a value that reality has reached and find the date when
# the scenario path reached the same value. Lag = realityDate - scenarioDate, in months.
# Positive lag = reality is behind the scenario; negative lag = reality is ahead.
# Where a proxy has not been reached, projectedDate is used instead of realityDate. For a not-yet proxy
# with no defensible projection, projectedDate is null, and (today - scenarioDate) is only a lower bound.
# This is the method the AI Futures Project uses in its own grading spreadsheets (linked in sources).
# Values between the scenario's sidebar checkpoints are interpolated log-linearly, which reproduces
# the authors' own interpolated dates.
#
# Format (one list item per proxy)
#   id              kebab-case
#   name            short label
#   metric          camelCase metric name (matches claims[].metric in ai2027.yaml where possible)
#   unit            optional unit label
#   scenarioDate    when the AI 2027 path reaches scenarioValue
#   scenarioRef     milestone id in ai2027.yaml
#   scenarioValue   the matched value, in `unit`
#   realityDate     when reality first reached it (null if not yet)
#   realityValue    optional: the observed value
#   realityRef      short description of the real-world observation
#   status          reached | not-yet
#   projectedDate   not-yet only: best evidence-based estimate, else null
#   projectionNote  how the projection was made
#   weight          1 normal, 0.5 if the proxy is fuzzy or the estimate is weak
#   note            caveats
#   sources         [url, ...]
#
# Computed lags (months, + = behind): compute-1e27 +9.1 · leading-lab-datacenter +0.3 · global-h100e -0.5 ·
# coding-time-horizon -1.1 · ai-rd-uplift +11.1 · revenue -6.7 · valuation +4.0 · global-ai-datacenter-spending -12.0 ·
# agent-1-mini -3.9 · china-centralization >= +1.8 (lower bound) · superhuman-coder +5.0 (projected) · public-salience +14.4
# Median over all 12 (lower bound used for china): +1.1. Weight-weighted median: +0.3. Weighted mean: +2.0.
# Median of the 7 weight-1 proxies: +0.3.
# For comparison, the authors' Aug 2026 estimate of ~75% of AI 2027's pace implies ~4-5 months behind after 17.7 months.
# The medians differ because revenue and spending run ahead while training compute and R&D uplift lag.

- id: compute-1e27
  name: First ~10^27 FLOP training run
  metric: trainingFlop
  unit: FLOP
  scenarioDate: 2025-12-01
  scenarioRef: agent-0
  scenarioValue: 1.0e27
  realityDate: 2026-09-03
  realityValue: 1.0e27
  realityRef: GPT-6 Astra (~1e27 FLOP, Epoch estimate, confidence Likely; trained on at least 100k GB200s at Abilene)
  status: reached
  projectedDate: null
  projectionNote: null
  weight: 1
  note: "Scenario date is the Late 2025 section, where Agent-0 is OpenBrain's latest public model; the compute supplement has its run finishing in May 2025, which would make the lag ~16 months. Epoch's next-largest runs are Grok 4 (5e26) and GPT-4.5 (3.8e26). The AI Futures Project estimates Claude Mythos 5 (Jun 2026) at ~1.5e27 including RL (80% CI 1e27-3e27), but Epoch has no estimate for it; if it counts, the lag is ~6 months."
  sources:
    - https://epoch.ai/models/gpt-6-astra
    - https://epoch.ai/data/ai-models
    - https://ai-2027.com/research/compute-forecast
    - https://docs.google.com/spreadsheets/d/1JfEJRIwGe7fSCIW14eC7q0sEhVWHEdetykVh9g9XnF8/edit?gid=1928509176

