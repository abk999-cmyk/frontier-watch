# How the AI 2027 authors' own forecasts moved, Apr 2025 to Sep 2026.
#
# Format (one list item per forecaster x publication x milestone)
#   forecaster       person, or group for aggregates
#   published        when the forecast was stated (ISO). For values recorded retroactively, this is the as-of
#                    date given by the authors, and the note says where it was recorded.
#   milestone        automated-coder | superhuman-ai-researcher | ted-ai | asi | agi
#                      automated-coder         AC: an AI that can fully automate an AGI project's coding, i.e. the
#                                              company would rather fire its engineers than stop using AI for coding.
#                                              AI 2027's "superhuman coder" (SC) is mapped here and flagged in the note
#                                              (the authors call SC similar to AC but somewhat stronger).
#                      superhuman-ai-researcher SAR: fully automates AI R&D; research taste matches the top human researcher.
#                      ted-ai                  Top-Expert-Dominating AI: at least as good as top human experts at virtually
#                                              all cognitive tasks. This is the project's definition of AGI from Jan 2026.
#                      asi                     at virtually all cognitive tasks, 2x as far above the best humans as the best
#                                              humans are above the median professional.
#                      agi                     informal "AGI" / "intelligence explosion" medians from before the TED-AI
#                                              definition was settled (the authors later chart these as AGI).
#   median           ISO date. Month-level values use the 1st of the month. Year-only values use YYYY-07-01
#                    (mid-year, the authors' own convention) with medianPrecision: year.
#   medianPrecision  month | year
#   basis            all-things-considered (the forecaster's bottom line) | model (raw model output)
#   note             optional
#   url              source
#
# Milestone definitions: https://www.aifuturesmodel.com and https://blog.aifutures.org/p/ai-futures-model-dec-2025-update
# From Aug 2026 the forecasts are explicitly conditional on progress going as fast as technically feasible
# (no government slowdown).

