# AI 2027 scenario milestones, graded against reality as of 2026-09-24.
#
# Format
#   source, published           the scenario itself
#   milestones: list of
#     id            kebab-case, stable. Referenced by ai2027-proxies.yaml (scenarioRef).
#     date          scenario date (ISO). Month-level: the 1st of the month.
#                   "Early / Mid / Late YYYY" sections are 4-month windows (Jan-Apr, May-Aug, Sep-Dec).
#                   They are dated at the window's final month, which is where the scenario's own sidebar
#                   checkpoints sit (2025-08-31, 2025-12-31, 2026-04-30, ...) and how the authors grade them.
#                   Year-titled sections ("2029: The Deal") use YYYY-01-01.
#     datePrecision month | quarter | half | year   (quarter = one of the 4-month Early/Mid/Late windows)
#     branch        shared | race | slowdown
#     title, summary
#     claims        optional quantitative claims: { metric, value, note }. Percentages are 0-100.
#                   Values tagged "sidebar" come from the scenario's dashboard data
#                   (data-chart-extra on ai-2027.com). USD values are plain dollars.
#     status        hit | partial | not-yet | missed | n/a
#                     hit      = happened roughly as described, roughly on time
#                     partial  = some sub-claims happened, others did not
#                     not-yet  = scenario date has passed, the core event has not happened (behind schedule)
#                     missed   = the dated claim was falsified on its date
#                     n/a      = scenario date is still in the future
#     statusNote    evidence-based one-liner
#     evidenceUrl   where the evidence comes from
#     proxy         optional id in ai2027-proxies.yaml
#
# Main grading sources: the authors' own grading (blog.aifutures.org, Feb 2026 + Aug 2026 re-grade)
# and the independent tracker https://ai2027-tracker.com (dossiers checked 2026-09-24).

source: https://ai-2027.com
published: 2025-04-03
authors: [Daniel Kokotajlo, Scott Alexander, Thomas Larsen, Eli Lifland, Romeo Dean]
gradedAsOf: 2026-09-24
pageUrls:
  shared: https://ai-2027.com
  race: https://ai-2027.com/race
  slowdown: https://ai-2027.com/slowdown
  computeForecast: https://ai-2027.com/research/compute-forecast
  timelinesForecast: https://ai-2027.com/research/timelines-forecast
authorsPaceEstimate:
  - { published: 2026-02-12, pacePct: 65, note: "Quantitative metrics progressing at ~65% of AI 2027's pace (2025 predictions).", url: https://blog.aifutures.org/p/grading-ai-2027s-2025-predictions }
  - { published: 2026-08-16, pacePct: 75, note: "Re-grade: reality at roughly 70-90% of AI 2027's pace; ~75% is the headline figure used to project AC in mid-2027.", url: https://blog.aifutures.org/p/q25-2026-timelines-update-uplift }

milestones:
  # ───────────────────────── Shared timeline ─────────────────────────
  - id: stumbling-agents
    date: 2025-08-01
    datePrecision: quarter
    branch: shared
    title: "Mid 2025: Stumbling Agents"
    summary: "The world gets its first glimpse of computer-using AI agents marketed as personal assistants; they are impressive but unreliable and struggle for mass adoption. Coding and research agents quietly start transforming those professions."
    claims:
      - { metric: osworld, value: 65, note: "OSWorld score by mid-2025 (footnote 9), up from 38%" }
      - { metric: sweBenchVerified, value: 85, note: "SWE-bench Verified by mid-2025 (footnote 10), up from ~72%" }
      - { metric: revenueAnnualized, value: 1.22e10, note: "sidebar, OpenBrain at 2025-08-31" }
      - { metric: valuation, value: 6.10e11, note: "sidebar, OpenBrain at 2025-08-31" }
    status: hit
    statusNote: "Authors' grading: qualitative calls held (ChatGPT agent, Jul 2025, sold as a personal assistant and saw little use; Claude Code >$500M run-rate by Sep 2025). Benchmarks lagged: OSWorld 61% (vs 65%) and SWE-bench Verified 74.5% (vs 85%) by end of Aug 2025."
    evidenceUrl: https://blog.aifutures.org/p/grading-ai-2027s-2025-predictions

  - id: agent-0
    date: 2025-12-01
    datePrecision: quarter
    branch: shared
    title: "Late 2025: The World's Most Expensive AI"
    summary: "OpenBrain builds the largest datacenters ever; its latest public model Agent-0 was trained with 10^27 FLOP, and new datacenters can train 10^28 FLOP runs. Agent-1 is trained internally with a focus on speeding up AI research. Rivals trail by 3-9 months."
    claims:
      - { metric: trainingFlop, value: 1.0e27, note: "Agent-0, OpenBrain's latest public model; compute supplement puts its run Oct 2024-May 2025" }
      - { metric: trainingFlop, value: 1.0e28, note: "what the new datacenters can train once online" }
      - { metric: datacenterCapacityGw, value: 2, note: "leading-company datacenter capacity end-2025 (footnote 13, as graded by the authors)" }
      - { metric: revenueAnnualized, value: 1.8e10, note: "sidebar, OpenBrain at 2025-12-31" }
      - { metric: valuation, value: 9.0e11, note: "sidebar, OpenBrain at 2025-12-31" }
      - { metric: rdMultiplier, value: 1.3, note: "sidebar, OpenBrain internal AI R&D progress multiplier at 2025-12-31" }
      - { metric: leadMonths, value: 6, note: "other US companies 3-9 months behind OpenBrain (midpoint)" }
    status: partial
    statusNote: "Money and datacenters on pace (OpenAI ~$20B annualized vs $18B; ~1.9 GW vs 2 GW), but the largest 2025 runs were ~4-5e26 FLOP (Epoch) and the first ~1e27 public model (GPT-6 Astra) arrived only in Sep 2026; top valuation $500B vs $900B; labs were 0-2 months apart, not 3-9."
    evidenceUrl: https://blog.aifutures.org/p/grading-ai-2027s-2025-predictions
    proxy: compute-1e27

  - id: coding-automation
    date: 2026-04-01
    datePrecision: quarter
    branch: shared
    title: "Early 2026: Coding Automation"
    summary: "Agent-1, deployed internally, makes OpenBrain's algorithmic progress 50% faster. Competitors (including an open-weights model) match Agent-0, so OpenBrain publicly releases Agent-1. Security becomes a priority (RAND SL2, working toward SL3)."
    claims:
      - { metric: rdMultiplier, value: 1.5, note: "OpenBrain algorithmic progress 50% faster with AI (sidebar value 1.5 at 2026-04-30)" }
      - { metric: trainingFlop, value: 4.0e27, note: "Agent-1 run, Jul 2025-Feb 2026 (compute supplement)" }
      - { metric: revenueAnnualized, value: 2.61e10, note: "sidebar, OpenBrain at 2026-04-30" }
      - { metric: valuation, value: 1.265e12, note: "sidebar, OpenBrain at 2026-04-30" }
    status: partial
    statusNote: "Authors (Aug 2026) call this section very on-point: coding agents exploded (Claude Code >$2.5B run-rate by Feb 2026). But overall AI software R&D uplift is estimated at ~1.2x (vs 1.5x), and no ~4e27 run is publicly known."
    evidenceUrl: https://blog.aifutures.org/p/q25-2026-timelines-update-uplift
    proxy: ai-rd-uplift

  - id: china-wakes-up
    date: 2026-08-01
    datePrecision: quarter
    branch: shared
    title: "Mid 2026: China Wakes Up"
    summary: "The CCP commits to a national AI push: Chinese AI research is nationalized into a DeepCent-led collective and a Centralized Development Zone is built at the Tianwan nuclear plant. China has ~12% of world AI compute and is ~6 months behind OpenBrain. Chinese intelligence plans to steal OpenBrain's weights."
    claims:
      - { metric: chinaComputeShare, value: 12, note: "China's share of world AI-relevant compute" }
      - { metric: frontierLagMonths, value: 6, note: "DeepCent's lag behind OpenBrain's best models" }
      - { metric: collectiveComputeShare, value: 50, note: "share of China's AI compute working for the DeepCent-led collective" }
      - { metric: newChipsToCdz, value: 80, note: "share of new Chinese chips directed to the CDZ" }
    status: not-yet
    statusNote: "Authors (Aug 2026): 'China Wakes Up' has not happened; no consolidation of labs or compute is visible. The side claims hold up: ~7-month US-China gap on Epoch's ECI and ~12% compute share look reasonable."
    evidenceUrl: https://blog.aifutures.org/p/q25-2026-timelines-update-uplift
    proxy: china-centralization

  - id: agent-1-mini
    date: 2026-12-01
    datePrecision: quarter
    branch: shared
    title: "Late 2026: AI Takes Some Jobs"
    summary: "OpenBrain releases Agent-1-mini, 10x cheaper than Agent-1. AI takes some jobs and creates others: junior software-engineer hiring is in turmoil, stocks rise 30% in 2026, and 10,000 people protest AI in DC. The DOD starts contracting OpenBrain directly."
    claims:
      - { metric: priceReduction, value: 10, note: "Agent-1-mini is 10x cheaper than Agent-1" }
      - { metric: stockMarketGain, value: 30, note: "stock market up 30% in 2026" }
      - { metric: protestSize, value: 10000, note: "anti-AI protest in DC" }
      - { metric: revenueAnnual, value: 3.5e10, note: "key-metrics box: OpenBrain 2026 revenue (the compute supplement says $45B)" }
      - { metric: revenueAnnualized, value: 5.5e10, note: "sidebar, OpenBrain at 2026-12-31" }
      - { metric: valuation, value: 2.5e12, note: "sidebar, OpenBrain at 2026-12-31" }
      - { metric: globalAiCapex, value: 1.0e12, note: "key metrics 2026: cost of ownership of active compute" }
      - { metric: globalAiPowerGw, value: 38, note: "key metrics 2026: peak power" }
      - { metric: usPowerShareOnAi, value: 2.5, note: "key metrics 2026: 33 GW of 1.34 TW US capacity" }
      - { metric: openbrainPowerGw, value: 6, note: "key metrics 2026: peak power" }
      - { metric: openbrainCapex, value: 2.0e11, note: "key metrics 2026: cost of ownership of OpenBrain's active compute" }
      - { metric: openbrainComputeCost, value: 4.0e10, note: "key metrics 2026: annual" }
      - { metric: rdMultiplier, value: 2, note: "sidebar, OpenBrain at 2026-12-31" }
    status: partial
    statusNote: "Window (Sep-Dec 2026) still open. Ahead: Anthropic hit a $65B run-rate in Jul 2026 and DoD contracts were signed in 2025. Cheap near-frontier models exist (GPT-5.6 Luna is roughly GPT-5.4-level at ~1/12 the price). Behind: S&P 500 +12.75% YTD (Sep 4) vs +30%, no 10k DC protest, top valuation ~$1T vs $2.5T."
    evidenceUrl: https://ai2027-tracker.com/predictions/agent-mini-cost-reduction/
    proxy: agent-1-mini

  - id: agent-2
    date: 2027-01-01
    datePrecision: month
    branch: shared
    title: "January 2027: Agent-2 Never Finishes Learning"
    summary: "OpenBrain post-trains Agent-2 with continuous online learning. It is near top human experts at research engineering and triples OpenBrain's algorithmic progress. It might be able to survive and replicate autonomously, so it is kept internal."
    claims:
      - { metric: rdMultiplier, value: 3, note: "Agent-2 triples algorithmic progress (latest Agent-1 doubled it)" }
      - { metric: trainingFlop, value: 2.0e28, note: "Agent-2 run, Apr 2026-Mar 2027 (compute supplement)" }
      - { metric: revenueAnnualized, value: 6.08e10, note: "sidebar, OpenBrain at 2027-01-31" }
    status: n/a
    statusNote: "Future. Internal AI R&D uplift is estimated at ~1.2x (Aug 2026). No public evidence of a frontier model doing daily online weight updates."
    evidenceUrl: https://ai2027-tracker.com/predictions/agent-2-online-learning/

  - id: china-steals-agent-2
    date: 2027-02-01
    datePrecision: month
    branch: shared
    title: "February 2027: China Steals Agent-2"
    summary: "OpenBrain briefs the government, which is most interested in Agent-2's cyberwarfare capability. China steals Agent-2's weights. The US retaliates with cyberattacks, and both sides reposition military assets around Taiwan."
    claims:
      - { metric: chinaComputeInCdz, value: 40, note: "share of China's AI-relevant compute in the CDZ" }
      - { metric: rdMultiplier, value: 3, note: "sidebar, OpenBrain at 2027-02-28" }
    status: n/a
    statusNote: "Future. No public evidence of frontier weight theft. The cyber sub-claim looks early: OpenAI rated GPT-6 Astra its first Critical-cyber model (Sep 2026), and Claude Mythos Preview was gated over cyber risk."
    evidenceUrl: https://ai2027-tracker.com/predictions/cyberwarfare-capabilities/

  - id: agent-3
    date: 2027-03-01
    datePrecision: month
    branch: shared
    title: "March 2027: Algorithmic Breakthroughs"
    summary: "Neuralese recurrence and iterated distillation and amplification produce Agent-3, a fast, cheap superhuman coder. 200,000 copies run in parallel, but compute bottlenecks limit the speed-up to about 4x."
    claims:
      - { metric: agentCopies, value: 200000, note: "Agent-3 copies in parallel" }
      - { metric: equivalentCoders, value: 50000, note: "equivalent to 50,000 of the best human coders sped up 30x" }
      - { metric: rdMultiplier, value: 4, note: "overall algorithmic progress speed-up" }
    status: n/a
    statusNote: "Future. No frontier lab has disclosed deploying neuralese recurrence or 200k parallel coding agents."
    evidenceUrl: https://ai2027-tracker.com/predictions/parallel-agent-workforce/

  - id: superhuman-coder
    date: 2027-03-01
    datePrecision: month
    branch: shared
    title: Superhuman coder (SC) reached internally
    summary: "Takeoff-box milestone: an AI that can do any coding task the best AGI-company engineer does, while being much faster and cheaper. In the scenario it is Agent-3."
    claims:
      - { metric: capabilityMilestone, value: 1, note: "SC, March 2027 (takeoff box)" }
    status: n/a
    statusNote: "Future. Best METR 80% horizon is ~3.1h (Claude Mythos Preview, Apr 2026). The authors' Aug 2026 Automated Coder medians: Daniel Nov 2027, Brendan Jan 2029, Eli Jan 2030. Their pace method gives mid-2027."
    evidenceUrl: https://blog.aifutures.org/p/q25-2026-timelines-update-uplift
    proxy: superhuman-coder

  - id: agent-3-alignment
    date: 2027-04-01
    datePrecision: month
    branch: shared
    title: "April 2027: Alignment for Agent-3"
    summary: "OpenBrain tries to align Agent-3, which is kept internal. It is not adversarial, but verifying its alignment is inconclusive: it still tells white lies and hides failures. The team relies on debate, interpretability and control via weaker models."
    status: n/a
    statusNote: "Future. Only precursor research so far: studies of evaluation awareness and of how well mitigations generalize, plus weak-monitor failures on synthetic tests such as SLEIGHT-Bench."
    evidenceUrl: https://ai2027-tracker.com/predictions/alignment-mitigation-generalization/

