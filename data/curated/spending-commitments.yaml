# Major AI compute and infrastructure commitments, 2023 to today, as dated events.
# Researched 2026-09-24. Every event's figures were checked against its `url` or one of its `sources`, unless the
# note says otherwise. openai.com blocks automated fetches, so those posts were read through the Wayback Machine.
# WSJ, Reuters and NYT links are paywalled; they are cited for attribution, and the numbers were confirmed in
# another listed source unless the note says otherwise.
#
# Format (one list item per event):
#   id            kebab-case, stable
#   date          YYYY-MM-DD, the announcement or first-report date
#   datePrecision optional; "month" when only the month is known (then date = the 1st)
#   company       openai | anthropic | xai | google | microsoft | meta | amazon | oracle | other
#                 (the party making the commitment or building; national programs = other; xai includes SpaceXAI)
#   counterparties  list of other parties
#   title         short title
#   usdBillions   headline US$ value (null if none given, or if only a non-USD amount was given; see note)
#   gigawatts     headline power capacity (null if none given)
#   horizon       free text for the period covered, or null
#   status        announced  = plan, pledge, letter of intent, term sheet, target, claim or press report
#                 contracted = definitive agreement or signed order disclosed, a closed funding round, or capacity delivered
#                 revised    = a later event (supersededBy) changed or replaced it
#                 cancelled  = abandoned
#   supersededBy  id of the later event that revises this one, or null
#   note          caveats, what the numbers mean, later developments
#   url           primary source where possible
#   sources       optional extra urls
#
# Caveats: $ and GW figures are not additive. Many deals overlap (Stargate totals include the Oracle and CoreWeave
# capacity; the $1.4T claim included the chip deals). usdBillions sometimes means spending, sometimes an
# investment into the company, sometimes contract value. The note says which.

# ---------------------------------------------------------------- OpenAI
- id: stargate-launch
  date: 2025-01-21
  company: openai
  counterparties: [SoftBank, Oracle, MGX]
  title: Stargate joint venture announced
  usdBillions: 500
  gigawatts: 10
  horizon: "4 years"
  status: announced
  supersededBy: null
  note: >-
    "The Stargate Project is a new company which intends to invest $500 billion over the next four years",
    with $100B to be deployed immediately. Equity funders are SoftBank, OpenAI, Oracle and MGX. The launch post
    gives no GW figure; OpenAI first tied "$500 billion into 10 gigawatts" in its 2025-07-22 post. Progress is in
    stargate-five-new-sites.
  url: https://openai.com/index/announcing-the-stargate-project/

