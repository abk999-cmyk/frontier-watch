  company: openai
  counterparties: [Oracle, SoftBank, Vantage]
  title: Five new Stargate sites bring planned capacity to nearly 7 GW
  usdBillions: 400
  gigawatts: 7
  horizon: "3 years"
  status: announced
  supersededBy: null
  note: >-
