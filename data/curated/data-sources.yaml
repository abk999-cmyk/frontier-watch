# ---------------------------------------------------------------- Epoch AI: inference cost ("The plunging price of thought")
- id: epoch-inference-cost-curves
  url: https://raw.githubusercontent.com/droodman/inference-cost/main/data/cost_truncated_curves.csv
  status: 200
  format: csv
  columns: [run_id, model, benchmark, effort, budget_axis, budget, acc, mean_tokens_used, mean_output_tokens, mean_input_tokens, mean_cached_input_tokens, mean_cache_write_tokens, cost_per_task_usd, full_run_acc, n_samples, price_date, price_source]
  notes: >-
    The core dataset behind "The plunging price of thought" (Epoch report, 2026-09-22,
    https://epoch.ai/publications/the-plunging-price-of-thought; repo https://github.com/droodman/inference-cost,
    public, default branch main, last push 2026-09-24T14:49Z). 15,959 rows, 1,298 runs, 225 models, 11 benchmarks:
    gpqa, aime, chess, math_lvl5, fm_tiers1_3_v2, fm_2025_02_private, mystery_agent, swe_bench_verified, simpleqa,
    fm_tier4_2025_07_private, fm_tier4_v2. Each run (model x benchmark x effort) is replayed at token caps
    budget = 64, 128, ... 131072. budget_axis says whether output or total tokens are capped. acc is the accuracy
    under that cap, and full_run_acc the uncapped accuracy (at the largest cap they agree for 1,232 of 1,298 runs).
    cost_per_task_usd = mean tokens x the model's API price on price_date (price_source is mostly openrouter-wayback;
    gpu-effective for open models without an API). The file has NO release date. Join model to
    "Model versions-Grid view.csv" (below). The report page links /data/cost_truncated_curves.csv on epoch.ai, but
    that URL returns 404 HTML, so use this raw GitHub URL.
    HOW TO COMPUTE "cheapest cost per task to reach capability X over time" (the paper's Pareto cost frontier):
    (1) Clean model names as prepare_data.R does: strip "-maas..." and a trailing "-YYYY-MM-DD..."; average duplicates
    by (model, benchmark, effort, budget). (2) release_date = the earliest "Version release date" among registry ids
    that start with the cleaned name (case-insensitive). (3) For one benchmark and threshold a,
    C_t(a) = min{ cost_per_task_usd_i : acc_i >= a and release_date_i <= t }. Every (run, budget) row is a candidate
    point, so a model can qualify cheaply with a small cap. Step t over dates to get a falling staircase. (4) Optionally
    express a in ECI units with epoch-edi-scores: C = logit(a)/estimated_slope_scaled + edi. Headline results: -47% per
    quarter (~13x/yr) since 2023, -66%/qtr (75x/yr) right after a level debuts as SOTA, and -32%/qtr two years later.
  checked: 2026-09-24

