# Machine-readable data sources for the fetch scripts, each tested with curl on 2026-09-24.
#
# Format (one list entry per URL)
#   id        kebab-case, stable
#   url       exact URL that was fetched (follow redirects: curl -L)
#   status    final HTTP status seen on 2026-09-24
#   format    zip | csv | yaml | json | html | parquet (content-type in notes where useful)
#   columns   header row / top-level keys, verbatim
#   notes     row counts, date coverage, caveats, how to derive things
#   checked   date of the curl test
# Entries with status 403/404 are recorded so nobody retries them.

# ---------------------------------------------------------------- Epoch AI: benchmarks + ECI
- id: epoch-benchmarks
  url: https://epoch.ai/data/benchmark_data.zip
  status: 200
  format: zip/csv
  columns: [README.md, benchmark_metadata.csv, model_metadata.csv, epoch_capabilities_index/eci_scores.csv, epoch_capabilities_index/edi_scores.csv, epoch_capabilities_index/processed_data_for_eci.csv, epoch_capabilities_index/eci_bootstraps.json, "<benchmark>.csv x 15 Epoch-run", "<benchmark>_external.csv x 66"]
  notes: >-
    application/zip, 2,317,359 bytes, 88 files (zip entries dated 2026-09-24). All 15 Epoch-run per-benchmark CSVs
    (gpqa_diamond, math_level_5, swe_bench_verified, otis_mock_aime_2024_2025, frontiermath*, simpleqa_verified,
    chess_puzzles, mystery_game_puzzles, ...) share the header [Model version, mean_score, Best score (across scorers),
    Release date, Organization, Country, Training compute (FLOP), Training compute notes, stderr, Log viewer, Logs,
    Started at, id]. Scores are 0-1. The "Model version" carries an effort suffix (e.g. qwen3.8-max-0902_xhigh).
    *_external.csv files have benchmark-specific headers. benchmark_metadata.csv header: [benchmark, in_eci,
    source_file, score_column, scale, random_baseline, score_ceiling, release_date, superseded_by].
    CC BY 4.0, cite "Epoch AI, 'Capabilities & Benchmarking'".
