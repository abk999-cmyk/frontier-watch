# ---------------------------------------------------------------- Dr Alan D. Thompson (LifeArchitect.ai)
- id: lifearchitect-asi-sheet
  url: https://docs.google.com/spreadsheets/d/e/2PACX-1vRXekMEE3KEmD0ADHCGVBW1Ki0vFaectMyFgz0I1vu9qc1zfIjzLxih5xxeoKrSXCdq4chM-W-eTMDp/pub?output=csv
  status: 200
  format: csv
  columns: ["#", Check, ASI milestone (2/50 achieved), Type, Last updated, Link 1, Link 2, Notes]
  notes: >-
    text/csv, 7,960 bytes, 55 data lines. 51 numbered milestones (# 0-50) plus section rows whose "#" cell is text
    ("PHASE 1: EARLY ASI, DISCOVERY, AND SIMULATION", "PHASE 2: GOVERNANCE AND ECONOMIC TRANSFORMATION",
    "PHASE 3: PHYSICAL WORLD INTEGRATION", "About this sheet"), which should be skipped. Check is an emoji status:
    green circle = achieved (2), orange circle = partially achieved (32), white circle = not achieved (17). The CSV has
    no legend; these meanings come from the same author's asi-animation.html legend ("Not achieved / Partially achieved /
    Achieved"), and 2 greens matches the "2/50 achieved" header. The achieved count is
    also embedded in the third header ("2/50 achieved"), so read columns by position. "Last updated" is free text
    ("2025", "May/2026", "Dec/2025"). Example: 4,🟢,First major new mathematical proof,Logistics,May/2026,https://openai.com/index/model-disproves-discrete-geometry-conjecture/,...
  checked: 2026-09-24

- id: lifearchitect-agi-gauge
  url: https://lifearchitect.ai/agi/
  status: 200
  format: html
  columns: []
  notes: >-
    text/html, 303,249 bytes (send a browser User-Agent). Exactly one `gauge.set(` call, which holds the current AGI
    countdown %. `gauge.setMinValue(0)` sits on a nearby line, so match the exact pattern. Snippet (line ~3091):
      gauge.animationSpeed = 64; // set animation speed (32 is default value) 128 slow, 32 fast
      gauge.set(99); // set actual value //Alan change this! adt
    Regex: gauge\.set\(\s*([0-9.]+)\s*\)  -> "99" on 2026-09-24. This page has no EVENTS_RAW.
  checked: 2026-09-24

- id: lifearchitect-asi-animation
  url: https://lifearchitect.ai/asi-animation.html
  status: 200
  format: html
  columns: []
  notes: >-
    text/html, 30,411 bytes. `const EVENTS_RAW = [` at line ~324 is a JS array of 80 entries shaped
    [monthStr "Mon/YYYY", order (int, same-month tiebreak; the page adds order x 2 days to the timestamp), [milestone ids],
    isAchieved?]. The optional 4th element `true` marks ids reaching "achieved" (green). Ids in events without it show
    as "partially achieved" (orange; legend: grey Not achieved / orange Partially achieved / green Achieved). Snippet:
      const EVENTS_RAW = [
        ["Jul/2022",0,[1]],
        ["May/2026",5,[4,5],true],
    It runs from Jul/2022 to Aug/2026, and only the May/2026 entry (ids 4, 5) carries true. Ids match the sheet's "#".
    Extract the block with (?s)const EVENTS_RAW = \[(.*?)\n\]; and then parse each entry with
    \[\s*"([A-Z][a-z]{2}/\d{4})"\s*,\s*(\d+)\s*,\s*\[([\d,\s]*)\]\s*(?:,\s*(true))?\s*\]
    The page also defines `const PHASES` (line ~298). It has no gauge.set.
  checked: 2026-09-24

