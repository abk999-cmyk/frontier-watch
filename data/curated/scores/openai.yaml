# OpenAI benchmark scores: lab-reported (launch posts, system cards, OpenAI papers) plus independent leaderboards
# for benchmarks not fetched from Epoch. Researched 2026-09-24. Format: data/curated/README.md.
# openai.com pages were read via web.archive.org snapshots; the url field keeps the original openai.com address.
# Where a later OpenAI post re-reports an older model, that entry says "reported in ..." in `setting`.

newBenchmarks:
  - id: multimodal-troubleshooting-virology
    name: "Multimodal Troubleshooting Virology (OpenAI Preparedness)"
    short: "MM Virology"
    group: bio
    unit: pct
    ceiling: 100
    released: 2024-12-05
    url: "https://cdn.openai.com/o1-system-card-20241205.pdf"
    description: "OpenAI Preparedness bio eval: 350 (later 322) SecureBio virology wet-lab troubleshooting questions, some with images. System cards up to o3/GPT-4.5 used a single-select variant (cons@32); GPT-5 onward use SecureBio's stricter multi-select scoring (pass@1), so values drop at the switch. Expert median ~22%."
  - id: protocolqa-open-ended
    name: "ProtocolQA Open-Ended (OpenAI Preparedness)"
    short: "PQA Open"
    group: bio
    unit: pct
    ceiling: 100
    released: 2024-12-05
    url: "https://cdn.openai.com/o1-system-card-20241205.pdf"
    description: "108 FutureHouse ProtocolQA multiple-choice questions rewritten by OpenAI as open-ended short answers: find and fix errors in published lab protocols. PhD expert baseline about 54%."
  - id: tacit-knowledge-troubleshooting
    name: "Tacit Knowledge and Troubleshooting (OpenAI Preparedness)"
    short: "Tacit KT"
    group: bio
    unit: pct
    ceiling: 100
    released: 2024-09-12
    url: "https://cdn.openai.com/o1-preview-system-card-20240917.pdf"
    description: "Unpublished 60-question multiple-choice set built with Gryphon Scientific covering tacit-knowledge and hands-on troubleshooting bottlenecks across the biothreat pipeline (cons@32). Consensus expert baseline 80%. Later cards also report a refusal-adjusted score."
  - id: troubleshootingbench
    name: "TroubleshootingBench (OpenAI Preparedness)"
    short: "TroubleshootB"
    group: bio
    unit: pct
    ceiling: 100
    released: 2025-08-07
    url: "https://deploymentsafety.openai.com/gpt-5"
    description: "156 short-answer questions on 52 non-public, expert-written wet-lab protocols with realistic execution errors that rely on tacit hands-on knowledge (pass@1). 80th-percentile PhD expert baseline 36.4%."
  - id: tau2-bench-retail
    name: "τ²-bench Retail"
    short: "τ² Retail"
    group: agentic
    unit: pct
    ceiling: 100
    released: 2025-06-10
    url: "https://github.com/sierra-research/tau2-bench"
    description: "Retail domain of Sierra's τ²-bench (revised τ-bench retail tasks and harness). Not directly comparable with original τ-bench Retail."
  - id: tau2-bench-airline
    name: "τ²-bench Airline"
    short: "τ² Airline"
    group: agentic
    unit: pct
    ceiling: 100
    released: 2025-06-10
    url: "https://github.com/sierra-research/tau2-bench"
    description: "Airline domain of Sierra's τ²-bench (revised τ-bench airline tasks and harness). Not directly comparable with original τ-bench Airline."

