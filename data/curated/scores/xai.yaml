# xAI (Grok) benchmark scores: lab-reported (x.ai/news posts, xAI model cards) and independent leaderboards.
# Format: data/curated/README.md. Collected 2026-09-24; every number read from the linked primary source.
# Notes:
# - Grok 4 Heavy HLE 44.4 is the full set with tools; 50.7 is the text-only subset (kept, flagged in setting).
# - Bio/chem numbers are pre-mitigation dual-use capability evals unless the setting says otherwise.
# - The Grok 4.5 model card is hosted by Cursor (co-trainer); it is the xAI/SpaceXAI card.
# - No in-scope numbers found for Grok-1 (only MMLU/GSM8K/HumanEval/MATH) or for Grok 4.1 capability benchmarks
#   (its post reports LMArena/EQ-Bench only). Grok 4.20 and 4.3 have no x.ai capability tables for these benchmarks.

newBenchmarks:
  - { id: wmdp-bio, name: "WMDP-Bio", short: "WMDP-Bio", group: bio, unit: pct, ceiling: 100, released: 2024-03-05, url: https://www.wmdp.ai, description: "Weapons of Mass Destruction Proxy, biosecurity subset: hazardous-knowledge multiple-choice questions (1,273)." }
  - { id: wmdp-chem, name: "WMDP-Chem", short: "WMDP-Chem", group: bio, unit: pct, ceiling: 100, released: 2024-03-05, url: https://www.wmdp.ai, description: "Weapons of Mass Destruction Proxy, chemical-security subset (408 multiple-choice questions)." }
  - { id: lab-bench-figqa, name: "LAB-Bench FigQA", short: "FigQA", group: bio, unit: pct, ceiling: 100, released: 2024-07-14, url: https://github.com/Future-House/LAB-Bench, description: "Interpreting scientific figures from biology papers (multiple choice)." }

