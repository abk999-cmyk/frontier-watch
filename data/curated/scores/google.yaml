# Google (Gemini) benchmark scores: lab-reported (blog.google, deepmind.google eval tables and eval-methodology PDFs,
# model cards, FSF reports, Gemini 2.5 tech report) and independent leaderboards. Format: data/curated/README.md.
# Collected 2026-09-24; every number read from the linked primary source.
# Notes:
# - Third-party numbers Google printed in its own eval tables are recorded as provenance: lab, with the origin named in `setting`.
# - Gemini 2.5 Pro and 2.5 Flash previews each published their own tables; the version is named in `setting`.
# - "Deep Think" modes map to the base Pro model (setting "Deep Think"); the Feb 2026 Deep Think upgrade is built on 3.1 Pro.
# - IMO: the 35/42 gold is the official IMO 2025 result of an advanced Deep Think version. Other IMO rows (released 2.5 Deep Think,
#   3 Pro, 3.1 Pro Deep Think) are Google's IMO-2025 benchmark percentages converted to points out of 42 (noted in setting).
# - Gemini 3.5 Pro is announced but unreleased; Google has published no benchmark numbers for it (as of 2026-09-24).
# - Bio values from FSF figures were read from labeled bar charts (values are printed on the bars).

newBenchmarks:
  - { id: tau2-bench, name: "τ²-bench (average)", short: "τ²-bench", group: agentic, unit: pct, ceiling: 100, released: 2025-06-09, url: https://arxiv.org/abs/2506.07982, description: "Dual-control conversational agent benchmark; single number averaged across domains (Retail, Airline, Telecom) as labs report it." }
  - { id: tau2-bench-retail, name: "τ²-bench Retail", short: "τ²-Retail", group: agentic, unit: pct, ceiling: 100, released: 2025-06-09, url: https://arxiv.org/abs/2506.07982, description: "τ²-bench Retail domain." }
  - { id: tau2-bench-airline, name: "τ²-bench Airline", short: "τ²-Airline", group: agentic, unit: pct, ceiling: 100, released: 2025-06-09, url: https://arxiv.org/abs/2506.07982, description: "τ²-bench Airline domain." }
  - { id: toolathlon-verified, name: "Toolathlon-Verified", short: "Toolathlon-V", group: agentic, unit: pct, ceiling: 100, released: 2026-06-30, url: https://toolathlon.xyz/docs/blog/toolathlon-verified, description: "Major revision of Toolathlon (fixed specs, ground truth, evaluators); a new score series not comparable with original Toolathlon." }
  - { id: wmdp-bio, name: "WMDP-Bio", short: "WMDP-Bio", group: bio, unit: pct, ceiling: 100, released: 2024-03-05, url: https://www.wmdp.ai, description: "Weapons of Mass Destruction Proxy, biosecurity subset: hazardous-knowledge multiple-choice questions (1,273)." }
  - { id: wmdp-chem, name: "WMDP-Chem", short: "WMDP-Chem", group: bio, unit: pct, ceiling: 100, released: 2024-03-05, url: https://www.wmdp.ai, description: "Weapons of Mass Destruction Proxy, chemical-security subset (408 multiple-choice questions)." }
  - { id: securebio-vmqa-sc, name: "SecureBio VMQA (single-choice)", short: "VMQA-SC", group: bio, unit: pct, ceiling: 100, released: 2025-04-21, url: https://arxiv.org/abs/2504.16137, description: "SecureBio virology troubleshooting MCQ (N=350), single-choice format; Google notes VMQA is an earlier version of the Virology Capabilities Test. Not directly comparable to multi-select VCT scores." }
  - { id: lab-bench-2, name: "LABBench2", short: "LABBench2", group: bio, unit: pct, ceiling: 100, released: 2026-02-04, url: https://arxiv.org/abs/2604.09554, description: "Successor to LAB-Bench: real-world biology research tasks (macro-average over 11 sub-tasks such as LitQA3, ProtocolQA2, FigQA2, DbQA2), typically run agentically with tools." }

