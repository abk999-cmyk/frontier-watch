# Anthropic (Claude) benchmark scores.
#
# Sources are Anthropic system cards and launch posts (provenance: lab) plus third-party leaderboards
# (provenance: independent). Benchmarks our pipeline already pulls from Epoch (HLE independent runs,
# SWE-bench Verified leaderboard, Terminal-Bench 2.0, OSWorld/OSWorld 2.0, GPQA, ARC-AGI-1/2, GDPval,
# METR, Vending-Bench 2, DeepSWE, FrontierSWE, CritPt, FrontierMath, ...) are only recorded here when the
# number is lab-reported.
#
# Notes on conflicts and gaps:
#   conflict: Claude 4 card puts Sonnet 3.7 bioweapons-knowledge at 18/33 vs 17/33 in the 3.7 card; 3.7 uplift
#     1.53x (updated rubric) vs ~2.1x (own card) - both kept as separate settings
#   conflict: Claude 3.7 post lists 3.5 Sonnet (new) TAU-bench as 71.5/48.8 vs 69.2/46.0 in the Oct 2024 post; Oct
#     values kept
#   conflict: Opus 4.1 addendum gives Opus 4 long-form virology task 1 as 0.84 (Claude 4 card: 0.83) and creative
#     biology 0.47 (Claude 4 card: 0.45)
#   conflict: Opus 4.1 post re-reports Opus 4 / Sonnet 4 Terminal-bench as 39.2 / 35.5 (Terminus 1) vs Claude 4
#     post 43.2 / 35.5 (Claude Code); Sonnet 4 Terminus figure in Claude 4 post footnote is 33.5
#   conflict: LAB-Bench values differ between Opus 4.1 addendum (ProtocolQA 0.69, SeqQA 0.71, Cloning 0.56, FigQA
#     0.46) and Sonnet 4.5 card 10-shot figure (0.833/0.785/0.758/0.481); own-card values kept for Opus 4.1
#   conflict: Opus 4.5 τ²-bench airline (original) is 70.1 in Table 2.8 but 67.9 in the Table 2.3.A footnote; 70.1
#     kept
#   conflict: Mythos Preview card gives Opus 4.5 virology-trial critical failures as 5.6 vs 5.8 in the Opus 4.5
#     card
#   conflict: Sonnet 4.5 Terminal-Bench 2.0 is 50.0 in the Opus 4.5 card table but 51.0 in the Opus 4.6 card;
#     Sonnet 4.5 own post reports 50.0 for Terminal-Bench (1.0)
#   gap: Opus 4.6 card BioPipelineBench (53.1) and BioMysteryBench (61.5) are pre-"Verified" versions; not
#     recorded (Verified values from later cards used instead)
#   conflict: Opus 4.6 HLE-with-tools = 53.0 in its own card figure, 53.1 (Mythos Preview card) and 53.3 (Opus 4.7
#     card)
#   conflict: Sonnet 4.5 creative-biology is 0.506 in the Sonnet 4.6 card vs 0.488 in the Opus 4.6 card
#   conflict: Sonnet 5 card lists Sonnet 4.6 BrowseComp 76.2 and HLE 34.6/46.8 vs own card 74.01 and 33.2/49.0;
#     own card kept
#   conflict: Opus 4.8 card re-reports Opus 4.7 BioMysteryBench hard as 24.7 (own card 20.9) and BrowseComp 79.8
#     (own 79.3, new blocklist); own-card values kept
#   gap: Opus 4.8 card reports LatchBio "SpatialBench" (53.3, pre-Verified variant) - not recorded to avoid mixing
#     with SpatialBench Verified
#   conflict: Opus 4.8 Terminal-Bench 2.1 = 74.6 on Harbor/Terminus-2 (own card) vs 82.7 with mini-SWE-agent
#     (Fable 5 card); both kept as separate settings
#   conflict: Opus 5 / Fable 5.1 cards list "Fable 5" SWE-bench Multilingual 86.6 and Multimodal 54.1, while the
#     Fable 5 card gives Mythos 5 92.2 / 54.9
#   conflict: GDPval-AA Elo for Fable 5 drifts across cards (1932 on 2026-06-06 GDPval-AA; v2: 1783 on 06-17, 1747
#     in Opus 5 card, 1723 in Fable 5.1 card)
#   conflict: BioMysteryBench/LatchBio values for the same models differ between the Sonnet 5 card (Fig 8.14.6.A)
#     and the Opus 5 card (e.g. Sonnet 5 solvable 82 vs 87.5) because problems were removed/re-run; each model keeps
#     its own-card value
#   conflict: Fable 5.1 card re-reports Opus 5 HLE as 56.6/63.6 (Opus 5 card: 56.3/64.7) and GDPval-AA v2 1824
#     (Opus 5 card: 1861); own-card values kept
#   conflict: life-science re-runs in Fable 5.1 card differ from Opus 5 card (e.g. Opus 5 BioMysteryBench solvable
#     91.4 vs 90.1, protocols-understanding 80.0 vs 78.4); own-card values kept
#   conflict: Opus 5.5 card re-reports Fable 5.1 HLE-with-tools as 65.6 (Fable 5.1 card: 65.0); own-card value
#     kept
#   gap: Opus 5.5 protocols "Understanding (V2)" (69.0) is a new held-out set, not comparable; not recorded
#   finding: FrontierBench v0.1 (Opus 5 card) = Terminal-Bench 3.0 (74 tasks; identical Harbor scores for Fable 5
#     33.8 / Opus 4.8 21.1); mapped to terminal-bench-3
#   gap: Harbor Hub (TB 2.1/3.0) and ARC Prize leaderboards render client-side; TB 2.1/3.0 independent values come
#     from tbench.ai announcement posts, ARC-AGI-3 from ARC Prize results quoted in the Opus 5 card
#   gap: Scale SWE-Bench Pro leaderboard has no Claude entries after Opus 4.6; Scale commercial-set values for
#     Opus 4.1/Sonnet 4 are the original Sep-2025 runs
#   gap: swebench.com has no SWE-bench Full leaderboard any more, and no Claude entries past Opus 4.6; SWE-bench
#     Verified leaderboard rows are left to the Epoch feed
#   conflict: Opus 4.6 card/post quote Opus 4.5 HLE-with-tools as 43.4 vs 43.2 in the Opus 4.5 card figure
#     (own-card value kept)

