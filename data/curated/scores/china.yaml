# Lab-reported and independent-leaderboard scores for Chinese labs:
# DeepSeek (V3, R1, V4 Pro), Alibaba Qwen (Qwen3-235B, Qwen3.5, Qwen3.8-Max),
# Moonshot Kimi (K2, K2.5, K3) and Zhipu/Z.ai GLM (GLM-5, GLM-5.3).
# Compiled 2026-09-24 from model cards, tech reports and official blogs.
#
# Conventions used in this file:
# - `setting` starting with "checkpoint: <name>" marks a later same-name checkpoint
#   (e.g. DeepSeek-R1-0528, Qwen3-235B-A22B-2507, Kimi-K2-Instruct-0905,
#   DeepSeek-V4-Pro-0813 GA) filed under the parent model id. Filter on that prefix
#   to keep only the originally released checkpoint.
# - `setting` starting with "original ..." / "V4-Pro Preview, as reported in ..." marks a
#   lab's own number for the original checkpoint that first appeared in a later card.
# - `tools: true` = HLE with tools, or search-based browsing (BrowseComp). Agentic coding
#   harnesses (bash/edit) count as the benchmark's native setup, so `tools: false`.
# - `effort` omitted = the lab did not state one (model thinks by default);
#   `none` = non-thinking / instruct mode.

newBenchmarks:
  - id: browsecomp-zh
    name: BrowseComp-ZH
    short: BrowseComp-ZH
    group: agentic
    unit: pct
    ceiling: 100
    released: 2025-04-27
    url: https://arxiv.org/abs/2504.19314
    description: Chinese-web counterpart of BrowseComp (289 multi-hop questions), widely reported by Chinese labs.
  - id: toolathlon-verified
    name: Toolathlon-Verified
    short: Toolathlon-V
    group: agentic
    unit: pct
    ceiling: 100
    released: 2026-06-30
    url: https://toolathlon.xyz
    description: Final verified release of Toolathlon with revised tasks, ground truths and evaluators. Not comparable with the original Toolathlon.

