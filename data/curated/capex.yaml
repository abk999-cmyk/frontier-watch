  - { company: amazon, year: 2026, period: "CY2026", low: 220, high: 220, basis: "cash capex, net of proceeds and incentives (approximate point estimate)", stated: 2026-07-30, note: "Jassy on the Q2 2026 call: about $220B in 2026, up from about $200B (given Feb 2026, held in Apr 2026); raised mainly on higher memory prices, and still not enough capacity for 2026 demand.", url: "https://fortune.com/2026/07/30/andy-jassy-amazon-capex-demand-aws-pga-tour/" }
  - { company: google, year: 2026, period: "CY2026", low: 195, high: 205, basis: "purchases of property and equipment", stated: 2026-07-22, note: "Raised from $180-190B on the Q2 2026 call because capacity delivery sped up; about 60% servers, 40% data centers and networking. Alphabet expects capex to rise significantly again in 2027.", url: "https://finance.yahoo.com/markets/stocks/articles/googl-drops-nearly-5-hours-212540090.html" }
  - { company: meta, year: 2026, period: "CY2026", low: 130, high: 145, basis: "capex including principal payments on finance leases (Meta headline)", stated: 2026-07-29, note: "Narrowed from $125-145B (Apr 2026), which was raised from $115-135B (Jan 2026) on higher component prices.", url: "https://www.sec.gov/Archives/edgar/data/1326801/000162828026050596/meta-06302026xexhibit991.htm" }
  - { company: microsoft, year: 2026, period: "CY2026", low: 175, high: 175, basis: "capital expenditures including finance leases (Microsoft headline); approximate", stated: 2026-07-29, note: "About $175B for calendar 2026, down from about $190B (stated 2026-04-29, incl. about $25B from higher component prices) only because of an accounting change: from FY27, datacenter useful lives go from 15 to 25 years, moving some leases from finance to operating, which Microsoft's capex excludes. Q1 FY27 (Jul-Sep 2026) guided above $50B, and FY27 capex is to grow year on year.", url: "https://www.microsoft.com/en-us/investor/events/fy-2026/earnings-fy-2026-q4" }
  - { company: oracle, year: 2027, period: "FY2027 (Jun 2026-May 2027)", low: 90, high: 95, basis: "gross capital expenditures", stated: 2026-06-10, note: "Given with FY26 Q4 results and kept on 2026-09-10 (FY27 Q1). Net cash capex, after customer prepayments and vendor financing, is expected to be no more than about $70B. FY26 actual was $55.7B.", url: "https://www.investing.com/news/company-news/oracle-q1-fy2027-slides-cloud-infrastructure-surges-121-guides-90b-93CH-4897025" }
