# Hyperscaler capital expenditure by CALENDAR quarter, 2022-Q1 to the latest reported quarter.
# Researched 2026-09-24. Values in billions of USD (three decimals = the filing's $ millions).
#
# Format
#   quarters[]: { company, quarter, capex, financeLeases, headline?, period, note?, url, headlineUrl? }
#     company   microsoft | google | amazon | meta | oracle   (google = Alphabet Inc., consolidated)
#     quarter   calendar quarter, YYYY-Qn (see fiscalMapping)
#     capex     cash capex, see `definition`
#     financeLeases  see `financeLeasesBasis` (the meaning differs by company); null = not reported/derivable
#     headline  the company's own headline "capex" figure where it differs from cash capex (Microsoft, Meta)
#     period    exact fiscal period covered by the filing
#     url       the SEC filing (10-Q/10-K index) or earnings release the capex value comes from
#   guidance[]: latest forward capex guidance per company, { company, year, period, low, high, basis, stated, note, url }
#
# How the numbers were built: quarterly values were pulled from SEC EDGAR XBRL (companyconcept API) for
# PaymentsToAcquirePropertyPlantAndEquipment (Microsoft, Alphabet, Meta, Oracle) and PaymentsToAcquireProductiveAssets
# (Amazon's "Purchases of property and equipment"). Where a filing gives only year-to-date figures, the quarter is
# YTD minus the prior YTD (Q4 = 10-K annual minus 9-month YTD). Values are as FIRST reported for that period, except
# Meta 2022-2023, which use the net figures from Meta's earnings releases (see definition).
# Cross-checks: every Microsoft quarter matches "cash paid for PP&E" in the CFO's earnings remarks; Alphabet 2025-Q3..2026-Q2,
# Amazon 2026-Q2, Oracle FY26 Q1..FY27 Q1 and all Meta quarters match the companies' earnings releases; cash PP&E +
# finance-lease ROU reproduces Epoch's "broad capex" exactly for Microsoft and Amazon for every quarter 2022-Q1..2025-Q4.

definition: >-
  capex = "Purchases of property and equipment" from the cash-flow statement (cash paid in the quarter; excludes
  assets acquired under finance leases, operating leases, and PP&E received but not yet paid for).
  Microsoft: "Additions to property and equipment" (cash). Alphabet: "Purchases of property and equipment".
  Amazon: gross "Purchases of property and equipment"; Amazon's own "cash capex" quoted on calls is NET of
  "Proceeds from property and equipment sales and incentives" (about $0.8-1.1B/quarter lower in the 2025-26 quarters
  shown in the Q2 2026 release).
  Meta: "Purchases of property and equipment, net" (net of proceeds relating to property and equipment, Meta's
  presentation since 2024 and in every earnings-release FCF table; 2022-2023 10-Qs showed gross purchases,
  $0.02-0.13B/quarter higher, recorded in each note). Oracle: "Capital expenditures" (cash); Oracle also reports a
  lower non-GAAP "net cash outlay for capital expenditures" that subtracts vendor financing and customer prepayments.
  headline: Microsoft = "capital expenditures including finance leases" from the CFO's remarks (cash PP&E + new
  finance leases + change in PP&E accrued but not yet paid). Meta = "capital expenditures, including principal
  payments on finance leases" from each earnings release (= capex + financeLeases here, to within rounding).
  Alphabet's and Oracle's headline capex equals the cash figure, so no headline field.

financeLeasesBasis:
  microsoft: >-
    New finance leases (ROU assets obtained in exchange for finance-lease liabilities, 10-Q/10-K) through 2025-Q1.
    From 2025-Q2 (FY25 Q4), when Microsoft began stating the split, the CFO-stated "finance leases" figure is used; it
    matched the filing figure in FY25 Q4 (6.5 vs 6.503) but ran higher afterwards (the filing figure is in each note).
    From FY27 (Jul 2026) Microsoft extended datacenter useful lives from 15 to 25 years, which moves some future
    datacenter leases from finance to operating leases and so out of its headline capex.
  meta: >-
    Principal payments on finance leases (financing cash flow). This is NOT the value of new finance leases, but it is
    exactly what Meta adds to cash capex in its headline figure. Meta stopped tagging new finance-lease ROU assets after 2023.
  amazon: >-
    "Property and equipment acquired under finance leases, net of remeasurements and modifications" (supplemental
    cash-flow disclosure). Amazon's principal repayments of finance leases were much larger in 2022 ($1.5-2.8B/quarter)
    and are not included.
  google: >-
    ROU assets obtained in exchange for finance-lease liabilities; tagged from 2024 only (Alphabet described finance
    leases as not material for 2022-2023), so earlier quarters are null.
  oracle: >-
    ROU assets obtained in exchange for finance-lease liabilities, only where a standalone quarter can be derived from
    filings (2025-Q3, 2026-Q2, 2026-Q3); the other quarters are null.

fiscalMapping: >-
  Alphabet, Amazon and Meta use calendar fiscal years (quarter = calendar quarter). Microsoft's fiscal year ends
  June 30, so FY Q1 = Jul-Sep = CY Q3 of the prior calendar year, FY Q2 = Oct-Dec = CY Q4, FY Q3 = Jan-Mar = CY Q1,
  FY Q4 = Apr-Jun = CY Q2 (e.g. FY26 Q4 = 2026-Q2); these align exactly. Oracle's fiscal year ends May 31. Each
  Oracle quarter is assigned to the calendar quarter that holds most of it (its midpoint), the same rule Epoch uses:
  FY Q1 Jun-Aug -> CY Q3, FY Q2 Sep-Nov -> CY Q4, FY Q3 Dec-Feb -> CY Q1 (of the year the quarter ends), and
  FY Q4 Mar-May -> CY Q2 (e.g. FY27 Q1, Jun-Aug 2026 = 2026-Q3). So Oracle quarters are offset by one month from true
  calendar quarters.

epochCsvUrl: https://epoch.ai/data/charts/hyperscaler-capex-trend/stacked_hyperscalers_trend.csv # tested 2026-09-24: HTTP 200
epochNote: >-
  Epoch AI, "Hyperscaler capex has quadrupled since GPT-4's release" (Isabel Juniewicz, 2026-02-26; CSV updated
  2026-02-27; https://epoch.ai/data-insights/hyperscaler-capex-trend). Its CSV covers CY2022 Q1-CY2025 Q4 in $M and uses
  "broad capex" = cash PP&E + new finance-lease ROU assets (for Meta it infers new leases from ROU balance changes, and
  for Oracle it reconstructs them). That is a different definition from `capex` here, so Epoch's values were not
  transcribed. They were used as a cross-check: cash capex + the filings' finance-lease ROU figure reproduces Epoch to
  the $1M for every Microsoft and Amazon quarter 2022-Q1..2025-Q4. Alphabet matches except 2024-Q2..Q4 (off by -0.24 to
  +0.15), and Meta and Oracle differ only by Epoch's inferred-lease component.

