  url: https://www.nature.com/articles/s41586-023-06004-9

- id: flywire-whole-brain-connectome
  date: 2023-06-30
  title: "ML segmentation plus human proofreading yields the first whole adult-brain connectome"
  domain: science
  field: neuroscience
