  significance: 5
  verification: disputed
  autonomy: autonomous
  problem: Navier–Stokes existence and smoothness (Clay alternatives C and D)
  tags: [navier-stokes, millennium-prize, blow-up, lean]
  summary: "A 166-page paper claims that a 3D Navier–Stokes flow starting at rest, with a smooth force and bounded energy, blows up in finite time (Fefferman's alternatives C and D), with a Lean formalisation. The model is unnamed: OpenAI says only that it is an internal model 'significantly more capable than GPT-6 Astra', trained since 28 August through 'large-scale reinforcement learning on top of a previously pretrained model'. About 10,000 agents worked 88 hours (1–5 September) and GPT-6 Astra did the Lean work in 17 hours. The 'Bel' codename comes from an unconfirmed late-August leak about a 10T+ parameter pretrain succeeding 'Doug' (reportedly Astra's base); OpenAI has never named the base, so equating this model with Bel is speculation. Disputed: the unforced problem stays open, Alpöge and Buckmaster posted forced-Euler results hours earlier and raised credit and data-use complaints, and Clay said on 11 September that the problem has 'apparently been settled' without accepting a solution. On 21 September OpenAI said the same model had resolved 100+ other open problems, with no list published."
