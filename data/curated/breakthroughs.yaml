  summary: "Erdős asked in 1931 whether a set of n positive integers up to N with all subset sums distinct forces N ≫ 2^n. Working alone from a Lean statement, the model showed the answer is no: for every ε > 0 there are arbitrarily large n with such sets and N ≤ ε·2^n, beating Bohman's 0.22002·2^n. The Lean proof passed Epoch's Comparator check. The argument is ineffective (no bound on n in terms of ε), and Bloom's exposition recasts it via lattices and Siegel's lemma."
