- id: koethe-conjecture-astra-disproof
  date: 2026-09-03
  title: "GPT-6 Astra disproves the 1930 Köthe conjecture in ring theory"
  domain: math
  field: ring theory
  system: GPT-6 Astra (pre-release) in an Epoch AI run over Formal Conjectures' open problems
  model: GPT-6 Astra (pre-release)
  modelId: gpt-6-astra
  org: OpenAI model; run by Tom Adamczewski (Epoch AI)
  significance: 4
  verification: formal-proof
  autonomy: autonomous
  problem: Köthe conjecture (1930), Krempa's matrix form
  tags: [ring-theory, nil-ideals, lean, disproof]
  summary: "In one unsteered attempt (about 26 hours, $432) the model proved in Lean that Krempa's matrix form of the conjecture is false: an algebra over the algebraic closure of F₂ with a nil ideal I and a 2×2 matrix over I that is not nilpotent. A human paper by Adamczewski with ring theorists Böhmler and Marczinzik, who checked the mathematics, then refuted Köthe's original question directly (two nil left ideals whose sum is not nil) and answered a 1989 question of Rowen. Greenfeld, King and Vendramin found another counterexample with some help from the model. Not yet refereed."
  url: https://arxiv.org/abs/2609.07996

- id: smale-mean-value-conjecture-astra
  date: 2026-09-03
  title: "GPT-6 Astra disproves Smale's mean value conjecture with constant 1"
  domain: math
  field: complex analysis
  system: GPT-6 Astra (pre-release) in an Epoch AI run over Formal Conjectures' open problems
  model: GPT-6 Astra (pre-release)
  modelId: gpt-6-astra
  org: OpenAI model; run by Tom Adamczewski (Epoch AI)
  significance: 3
  verification: formal-proof
  autonomy: autonomous
  problem: Smale's mean value conjecture (K = 1)
  tags: [polynomials, critical-points, lean, disproof]
  summary: "Smale proved in 1981 that every complex polynomial has a critical point c with |p(z) − p(c)|/|z − c| ≤ 4|p'(z)| and conjectured the constant could be 1. The model gave a Lean-checked polynomial with p(0) = 0, p'(0) = 1 and |p(c)/c| > 1 at every critical point, so the conjecture with K = 1 (and the sharper (d−1)/d form) is false. It took one unsteered attempt of about 15 hours, and Comparator checked the statement against DeepMind's Formal Conjectures file. The witness has very large, unspecified degree and misses by a small margin, so the best constant between 1 and 4 is still open; no complex analyst is on record as having read the proof."
  url: https://github.com/tadamcz/mean-value-problem

