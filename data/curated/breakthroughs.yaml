  problem: "Erdős #74 ($500)"
  tags: [erdos, graph-theory, chromatic-number, lean]
  summary: "Erdős, Hajnal and Szemerédi expected graphs of infinite chromatic number in which every n-vertex subgraph can be made bipartite by deleting f(n) edges, however slowly f grows. The model proved the opposite: for some f → ∞ (apparently f ≍ log n/log log n) any such graph is 3-colourable. It is one of the two problems it solved within Epoch's fixed $300 budget, with six Lean-checked disproofs using three distinct arguments."
  url: https://www.erdosproblems.com/74

