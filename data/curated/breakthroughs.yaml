- id: gnome-materials
  date: 2023-11-29
  title: "GNoME predicts 381k new stable crystals; novelty claims later contested"
  domain: science
  field: materials science
  system: GNoME
  org: Google DeepMind
  significance: 2
  verification: disputed
  autonomy: tool
  tags: [materials-discovery, crystals, gnn]
  summary: "Reported 2.2M structures below the known convex hull, about 381k of them new stable materials. The DFT stability results stand, but the novelty and usefulness claims were challenged (Cheetham & Seshadri, Chem. Mater. 2024; >10% possible near-duplicates, SIAM J. Appl. Math.). Critiques by Palgrave, Schoop et al. led the companion A-Lab paper to publish a 2026 correction: 36 of 57 successes, with 'novel' meaning new to the platform."
  url: https://www.nature.com/articles/s41586-023-06735-9

- id: a-lab-autonomous-synthesis
  date: 2023-11-29
  title: "A-Lab robot synthesises 41 'new' materials in 17 days; claims later corrected"
  domain: science
  field: materials science
  system: A-Lab (ML-planned robotic synthesis)
  org: Lawrence Berkeley National Laboratory / UC Berkeley (with Google DeepMind predictions)
  significance: 2
  verification: disputed
  autonomy: autonomous
  tags: [self-driving-lab, materials-discovery, controversy]
  summary: "An autonomous lab used ML and literature-trained models to plan syntheses of predicted compounds and reported 41 of 58 targets made in 17 days. Palgrave, Schoop and others argued most were known disordered phases and the automated X-ray analysis was inadequate. A January 2026 correction conceded that 'novel' meant new to the prediction platform, dropped four targets as inconclusive and removed one as training-data contamination."
  url: https://www.nature.com/articles/s41586-023-06734-w

- id: funsearch-cap-set
