  org: DeepMind / EMBL-EBI
  significance: 3
  verification: peer-reviewed
  autonomy: tool
  tags: [protein-structure, database]
  summary: "Launched with 350k+ predicted structures, including about 98.5% of the human proteome. On 2022-07-28 it expanded to over 200M structures, covering nearly every catalogued protein. This is infrastructure built on AlphaFold 2, not a new method."
  url: https://www.ebi.ac.uk/about/news/press-releases/alphafold-database-launch

- id: deepmind-knots-kazhdan-lusztig
  date: 2021-12-01
  title: "ML guides mathematicians to new theorems in knot theory and representation theory"
  domain: math
  field: topology / representation theory
  system: Supervised learning + attribution analysis
  org: DeepMind with University of Oxford and University of Sydney mathematicians
  significance: 2
  verification: peer-reviewed
  autonomy: collaborative
  problem: Combinatorial invariance conjecture (Kazhdan–Lusztig polynomials)
  tags: [knot-theory, representation-theory, ml-guided-intuition]
  summary: "Models flagged hidden relationships that led mathematicians to a new theorem linking algebraic and geometric knot invariants, and to progress on the combinatorial invariance conjecture for Kazhdan–Lusztig polynomials."
  url: https://www.nature.com/articles/s41586-021-04086-x

- id: dm21-density-functional
  date: 2021-12-09
  title: "DM21 neural density functional fixes fractional-electron errors"
  domain: science
  field: quantum chemistry
  system: DM21
  org: DeepMind
  significance: 1
  verification: peer-reviewed
  autonomy: tool
  tags: [dft, quantum-chemistry]
  summary: "A neural exchange-correlation functional trained with fractional-charge and fractional-spin constraints corrected classic delocalization errors on benchmarks. Published comments questioned whether it generalizes, and later work found convergence failures on transition-metal chemistry."
  url: https://www.science.org/doi/10.1126/science.abj6511

- id: tokamak-rl-control
  date: 2022-02-16
  title: "Deep RL controls tokamak plasma shapes on real hardware"
  domain: science
  field: fusion plasma physics
  system: Deep RL magnetic controller
  org: DeepMind / EPFL Swiss Plasma Center
  significance: 2
  verification: peer-reviewed
  autonomy: tool
  tags: [fusion, plasma-control, reinforcement-learning]
  summary: "A policy trained in simulation commanded all 19 control coils of the TCV tokamak. It produced elongated, negative-triangularity and snowflake plasmas, and held two separate plasmas at once. A first in control engineering rather than new physics."
  url: https://www.nature.com/articles/s41586-021-04301-9

- id: alphatensor
  date: 2022-10-05
  title: "AlphaTensor discovers faster matrix multiplication algorithms"
  domain: math
  field: algorithms
  system: AlphaTensor
  org: DeepMind
  significance: 2
  verification: peer-reviewed
  autonomy: tool
  tags: [matrix-multiplication, reinforcement-learning, algorithms]
  summary: "An AlphaZero-style agent found a 4×4 matrix multiplication algorithm over GF(2) using 47 multiplications, versus 49 from applying Strassen twice. It also improved ranks for other small formats (4×5×5: 80→76). Humans beat some of its records within days."
  url: https://www.nature.com/articles/s41586-022-05172-4

- id: rfdiffusion
  date: 2022-12-10
  title: "RFdiffusion enables general de novo protein design"
  domain: science
  field: protein design
  system: RFdiffusion
  org: Baker lab, Institute for Protein Design (University of Washington)
  significance: 4
  verification: peer-reviewed
  autonomy: collaborative
  tags: [protein-design, diffusion]
  summary: "A diffusion model built on RoseTTAFold generates protein backbones for binders, symmetric assemblies and enzyme-site scaffolds. Hundreds of designs were tested experimentally, and the cryo-EM structure of a designed influenza binder nearly matched the design model. It became the standard generative tool for protein design. Preprint Dec 2022; Nature July 2023."
  url: https://www.nature.com/articles/s41586-023-06415-8

- id: coscientist-autonomous-chemistry
  date: 2023-04-11
  title: "Coscientist: a GPT-4 agent plans and runs real chemistry experiments"
  domain: science
  field: chemistry automation
  system: Coscientist (GPT-4 agent with lab automation)
  model: GPT-4
  modelId: gpt-4
  org: Carnegie Mellon University (Gomes lab)
  significance: 1
  verification: peer-reviewed
  autonomy: autonomous
  tags: [lab-automation, agents, chemistry]
  summary: "A GPT-4 agent searched documentation, wrote code for liquid handlers and a cloud lab, and planned and optimised palladium-catalysed cross-coupling reactions that were then run on real hardware. A capability demonstration of an LLM driving a lab, not new chemistry. Nature, December 2023."
  url: https://www.nature.com/articles/s41586-023-06792-0

- id: abaucin-antibiotic
  date: 2023-05-25
  title: "Abaucin: ML-guided narrow-spectrum antibiotic against A. baumannii"
  domain: science
  field: antibiotic discovery
  system: Neural network trained on growth-inhibition screens
  org: McMaster University / MIT
  significance: 1
  verification: peer-reviewed
  autonomy: tool
  tags: [antibiotics, drug-discovery, virtual-screening]
  summary: "A model trained on about 7,500 experimentally screened molecules predicted abaucin. It kills A. baumannii specifically by perturbing lipoprotein trafficking (LolE) and controlled infection in a mouse wound model. Preclinical."
  url: https://www.nature.com/articles/s41589-023-01349-8

- id: alphadev-sorting
  date: 2023-06-07
  title: "AlphaDev finds faster sorting routines, merged into LLVM libc++"
  domain: math
  field: algorithms
  system: AlphaDev
  org: Google DeepMind
  significance: 1
  verification: peer-reviewed
  autonomy: tool
  tags: [sorting, reinforcement-learning, algorithms]
