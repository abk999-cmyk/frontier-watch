  org: FlyWire Consortium (Princeton University and collaborators)
  significance: 3
  verification: peer-reviewed
  autonomy: tool
  tags: [connectome, drosophila, segmentation]
  summary: "Convolutional nets segmented an electron-microscopy volume of an adult fruit-fly brain, and about 33 person-years of human proofreading turned it into a synapse-level wiring diagram of 139,255 neurons and roughly 50 million synapses. AI made the project feasible but was not accurate enough alone, and most neurotransmitter identities are predicted rather than measured. Nature, October 2024."
  url: https://www.nature.com/articles/s41586-024-07558-y

