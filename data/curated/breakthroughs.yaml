# AI-driven math and science breakthroughs, 2016 → today. Format: data/curated/README.md (breakthroughs.yaml).
# Curated 2026-09-24. Entries run in chronological order. Every date and number was checked against the linked
# source or a primary source it cites.
#
# SCOPE
#   Results where AI was central to the discovery itself. Pure benchmark scores are excluded.
#   Olympiad results (IMO) count as math milestones but are capped at significance 2, because they are not new mathematics.
#   `date` is the first public disclosure (announcement or preprint). The `url` points to the best primary source,
#   usually the peer-reviewed version when one exists.
#
# SIGNIFICANCE (0–5). Levels 1–4 match the notability tiers of Epoch's FrontierMath: Open Problems;
# FM:OP problems use Epoch's own tier directly.
#   0  rediscovery: the result already existed (literature search, or a known answer found again)
#   1  moderately interesting: a real new result that matters mainly to specialists (a record, a counterexample, a minor open problem)
#   2  solid result: a strong researcher in the area would be happy with it; little attention outside the subfield
#   3  major advance: people across a broad area (all of number theory, all of structural biology…) take note
#   4  breakthrough: resolves a central, long-open problem or opens a new paradigm
#   5  Millennium Prize or Nobel level. Anchor: AlphaFold 2 = 5.
#   Grading is conservative. A disputed claim gets the grade it WOULD have if valid, and is marked `verification: disputed`.
#
# VERIFICATION (strongest evidence that applies)
#   formal-proof    the proof was checked in Lean
#   peer-reviewed   published in a refereed journal or conference, including workshop review
#   expert-endorsed independent experts, official graders or Epoch's problem verifiers accepted it, but it is not yet refereed
#   claimed         the developers or authors reported it and nobody has independently checked it yet
#   disputed        substantive public objections to the claim or its framing are unresolved
#
# AUTONOMY
#   tool            AI used as an instrument (prediction, search or optimisation) inside a human-directed project
#   collaborative   humans and AI iterated together, and both contributed core ideas
#   autonomous      the AI produced the core result end-to-end from a problem statement. Humans may have chosen the
#                   problem, run lab work or written it up.

- id: melvin-quantum-experiments
  date: 2016-03-04
  title: "MELVIN algorithm designs new quantum-optics experiments"
  domain: science
  field: quantum optics
  system: MELVIN
  org: University of Vienna / IQOQI (Zeilinger group)
  significance: 1
  verification: peer-reviewed
  autonomy: tool
  tags: [quantum-optics, experiment-design, automated-search]
  summary: "A computer search designed optical setups for complex entangled photon states, including the first design for a high-dimensional GHZ state; the designs were later built in the lab. Classical automated search, not machine learning: an early precursor of the field."
  url: https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.116.090405

- id: alphafold1-casp13
  date: 2018-12-02
  title: "AlphaFold wins CASP13 protein structure prediction"
  domain: science
  field: structural biology
  system: AlphaFold (v1)
  org: DeepMind
  significance: 3
  verification: peer-reviewed
  autonomy: tool
  tags: [protein-structure, casp]
  summary: "Placed first at CASP13. It gave high-accuracy predictions for 24 of 43 free-modelling domains; the next-best method managed 14. A big jump, but not yet competitive with experiment. Nature paper January 2020."
  url: https://www.nature.com/articles/s41586-019-1923-7

- id: halicin-antibiotic
  date: 2020-02-20
  title: "Deep learning identifies halicin, a structurally novel antibiotic"
  domain: science
  field: antibiotic discovery
  system: Message-passing neural network (Chemprop)
  org: MIT / Broad Institute (Collins lab)
  significance: 2
  verification: peer-reviewed
  autonomy: tool
  tags: [antibiotics, drug-discovery, virtual-screening]
  summary: "A model trained on about 2,500 molecules screened more than 100M compounds and flagged halicin, an existing but structurally unusual compound, as a broad-spectrum antibacterial. Halicin cleared A. baumannii infections in mice. It is a repurposed molecule and has not entered the clinic."
  url: https://doi.org/10.1016/j.cell.2020.01.021

- id: alphachip-floorplanning
  date: 2020-04-22
  title: "AlphaChip: RL chip floorplanning claimed superhuman, and disputed ever since"
  domain: science
  field: chip design
  system: AlphaChip (deep RL placement)
  org: Google / Google DeepMind
  significance: 2
  verification: disputed
  autonomy: tool
  tags: [chip-design, reinforcement-learning, controversy]
  summary: "Google reported that RL generates macro placements for TPU chips in hours that match or beat human experts (Nature, June 2021), and it named the method AlphaChip in a 2024 addendum. Nature added an editor's note in 2023. A UCSD replication found it underperforms, and Igor Markov published a detailed critique in CACM; Google rebutted in 2024. There is still no public-benchmark win or wider EDA adoption."
  url: https://www.nature.com/articles/s41586-021-03544-w

- id: alphafold2-casp14
  date: 2020-11-30
  title: "AlphaFold 2 solves protein structure prediction at CASP14"
  domain: science
  field: structural biology
  system: AlphaFold 2
  org: DeepMind
  significance: 5
  verification: peer-reviewed
  autonomy: tool
  tags: [protein-structure, casp]
  summary: "Median GDT 92.4 across CASP14 targets (87.0 on the hardest free-modelling targets) and about 1.6 Å median backbone error. For many proteins this is competitive with experimental structures, answering a 50-year grand challenge. Nature paper July 2021."
  url: https://deepmind.google/blog/alphafold-a-solution-to-a-50-year-old-grand-challenge-in-biology/

- id: ramanujan-machine
  date: 2021-02-03
  title: "Ramanujan Machine conjectures new formulas for fundamental constants"
  domain: math
  field: number theory
  system: Ramanujan Machine
  org: Technion
  significance: 1
  verification: peer-reviewed
  autonomy: tool
  tags: [continued-fractions, constants, conjecture-generation]
  summary: "Automated search algorithms produced previously unknown conjectured continued-fraction formulas for constants such as π, e and Catalan's constant. They are conjectures to be proved, not theorems."
  url: https://www.nature.com/articles/s41586-021-03229-4

- id: wagner-rl-counterexamples
  date: 2021-04-29
  title: "Reinforcement learning refutes open conjectures in graph theory"
  domain: math
  field: combinatorics
  system: Deep cross-entropy method (RL)
  org: Academic (A. Z. Wagner)
  significance: 1
  verification: expert-endorsed
  autonomy: tool
  tags: [counterexample, graph-theory, reinforcement-learning]
  summary: "A simple RL search found explicit counterexamples to several open conjectures in extremal combinatorics and spectral graph theory, including a question of Brualdi and Cao on permanents of pattern-avoiding matrices. The counterexamples are explicit and can be checked directly."
  url: https://arxiv.org/abs/2104.14516

- id: alphafold-database
  date: 2021-07-22
  title: "AlphaFold Protein Structure Database launches, later covering 200M+ proteins"
  domain: science
  field: structural biology
