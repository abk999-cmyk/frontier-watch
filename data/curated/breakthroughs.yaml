  problem: "Erdős–Sós conjecture (1962), Erdős #548"
  tags: [erdos, extremal-graph-theory, trees, lean]
  summary: "The 1962 conjecture says every graph with more than (k−2)n/2 edges contains every tree on k vertices; it was known only in special cases and was called one of the most tantalising problems in extremal graph theory. The model's proof is short and elementary, a double count over vertex orderings with an induction on the tree, and it is Lean-checked. The formal statement differs from the classical one by one edge when (k−1)n is odd. Found with a larger budget than the benchmark's $300 limit."
