  tags: [cap-set, program-search, llm-evolution]
  summary: "It evolved programs that construct the largest known cap set in dimension 8 (512 points) and admissible sets that improve the lower bound on the asymptotic cap-set capacity. It also found better bin-packing heuristics. DeepMind calls it the first discovery on an open math problem made with an LLM."
  url: https://www.nature.com/articles/s41586-023-06924-6

