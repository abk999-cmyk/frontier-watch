- id: gpt-4
  name: GPT-4
  lab: openai
  released: 2023-03-14
  tier: flagship
  status: released
  pretrain: true
  pretrainNote: "New base model (OpenAI's first GPT-4-class pretrain; size/architecture withheld in the tech report)"
  trainingFlop: 2.1e+25
  params: "~1.8T MoE (reported, SemiAnalysis)"
  openWeights: false
  # gpt-4-32k-* are the 32K-context GPT-4 snapshots (Epoch groups them with GPT-4); gpt-4-turbo/-1106/-0125 are a different model.
  epochIds: ["gpt-4-0314", "gpt-4-0613", "gpt-4-32k-0314", "gpt-4-32k-0613"]
  eciNames: ["GPT-4 (Mar 2023)", "GPT-4 (Jun 2023)"]
  sources:
    - https://arxiv.org/abs/2303.08774
    - https://en.wikipedia.org/wiki/GPT-4
